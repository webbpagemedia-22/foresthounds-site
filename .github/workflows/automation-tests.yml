# Tests for the weekly headline tooling in automation/.
name: Automation tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test "automation/tests/*.test.mjs"
      - run: pip install -r automation/requirements.txt
      - run: pytest automation/tests -q
